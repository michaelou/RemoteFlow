# Turn a tag into a reviewable draft release. Nothing here publishes anything: the last step of a release
# is a human reading the draft and pressing the button.
#
# RemoteFlow has no telemetry and no cloud dependency, and nothing here phones home. It does have an
# opt-in update check and, behind a second press and a confirmation, an in-app install of what that check
# found -- which is why the smoke test now covers an upgrade and why the checksums.txt shape is asserted
# rather than assumed. Both are contracts the application parses; see docs/adr/0018-self-update.md.
#
# The two architectures build on runners of their own architecture rather than cross-publishing from one
# machine. That costs a second runner and buys the thing this workflow exists for: every artefact is
# launched and asked for its version before it can reach a release page. A cross-published ARM64 binary
# cannot be run on an x64 runner, and "we could not test it" is not a state a release should be in.
#
# Every action is pinned by commit SHA. The trailing comment records the tag the SHA came from; when
# bumping, resolve the new tag to its SHA rather than trusting the tag to stay put.
name: Release

on:
  push:
    tags:
      - 'v*'

# The build jobs only read. Only the job that touches the release page gets contents: write, and nothing
# in this workflow needs any other scope.
permissions:
  contents: read

# Never two runs for one tag at once: the create-or-update step decides what to do by looking at whether
# the release already exists, and two runs racing on that check is how a tag ends up with two releases.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: build (${{ matrix.rid }})
    strategy:
      # A release with one architecture missing is not a release, so a failing leg should stop the other
      # rather than leave a half-built set to be reasoned about.
      fail-fast: true
      matrix:
        include:
          - rid: win-x64
            runner: windows-latest
          - rid: win-arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # MinVer reads tags and commit height. Without full history the build stamps a prerelease
          # version that disagrees with the tag, and the version check below would be the only thing
          # standing between that and a mislabelled release.
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # The tag reaches the script through the environment rather than through ${{ }} interpolation: a tag
      # name is attacker-controllable text, and interpolating it into a shell body would run it.
      - name: Read the version from the tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = $env:TAG.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+') {
            throw "The tag $($env:TAG) does not look like a version. Tags are written v0.1.0 or v0.1.0-rc.1."
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      # -RequireInstaller turns the missing-Inno-Setup warning into an error. The runner images carry
      # Inno Setup 6, and a release that quietly shipped zips and no installers because a tool moved is
      # exactly the silent partial success worth failing on.
      - name: Build the artefacts
        run: ./scripts/publish-windows.ps1 -Runtime ${{ matrix.rid }} -RequireInstaller

      # The gate. Extracts the zip and installs the installer, then runs --version on each and checks it
      # reports the version in the tag. A binary that does not start, or a build whose version does not
      # match its tag, fails the workflow here and never reaches a release page.
      #
      # -IncludeUpgrade additionally runs the installer over itself, which is what an in-app update does:
      # it proves a silent run with no /DIR reuses the recorded install location and that the relaunch
      # only fires for /UPDATE. Both are things RemoteFlow's updater depends on and nothing else tests.
      - name: Smoke-test the artefacts
        run: >
          ./scripts/smoke-test-artifacts.ps1
          -ExpectedVersion ${{ steps.version.outputs.version }}
          -Runtime ${{ matrix.rid }}
          -IncludeInstaller
          -IncludeUpgrade

      # Only on failure: the Inno Setup logs are the only record of what the installer actually did, and an
      # upgrade that fails on a runner cannot be diagnosed by reading the script.
      - name: Upload the installer logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installer-logs-${{ matrix.rid }}
          path: artifacts/*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload the artefacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.rid }}
          path: |
            artifacts/RemoteFlow-${{ steps.version.outputs.version }}-${{ matrix.rid }}.zip
            artifacts/RemoteFlow-${{ steps.version.outputs.version }}-${{ matrix.rid }}-setup.exe
          if-no-files-found: error
          retention-days: 7

  release:
    name: draft release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The only write in the workflow, and the narrowest scope that can create a release.
    permissions:
      contents: write

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The notes are generated from the log between the previous tag and this one.
          fetch-depth: 0

      - name: Read the version from the tag
        id: version
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = $env:TAG.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+') {
            throw "The tag $($env:TAG) does not look like a version."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          # A version with a prerelease part is a release candidate, and GitHub should say so.
          $prerelease = if ($version -match '-') { 'true' } else { 'false' }
          "prerelease=$prerelease" >> $env:GITHUB_OUTPUT

      - name: Download the artefacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: release-*
          merge-multiple: true

      - name: Check the full set arrived
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          version="$VERSION"
          missing=0
          for rid in win-x64 win-arm64; do
            for file in "RemoteFlow-$version-$rid.zip" "RemoteFlow-$version-$rid-setup.exe"; do
              if [ ! -f "dist/$file" ]; then
                echo "::error::dist/$file is missing."
                missing=1
              fi
            done
          done
          [ "$missing" -eq 0 ]
          ls -l dist

      # sha256sum's own format, so a user can verify the whole set with `sha256sum --check` rather than
      # comparing hashes by eye. Sorted by filename to keep the file stable across re-runs.
      - name: Write checksums.txt
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.zip *.exe | sort -k 2 > checksums.txt
          cat checksums.txt

      # Recomputing what was just computed sounds circular, but it is checking the file GitHub will serve
      # rather than the variable that produced it: a truncated write or a stray file shows up here.
      #
      # The shape check is not circular at all. RemoteFlow's updater parses this file to find the digest of
      # the installer it just downloaded, and refuses to run anything it cannot find a digest for — so the
      # format is an interface now, not just something a human reads, and a release that broke it would
      # silently disable self-update for everyone already running.
      - name: Verify checksums.txt
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check --strict checksums.txt
          total=$(grep -c . checksums.txt)
          parseable=$(grep -cE '^[0-9a-f]{64}  [^/\\]+$' checksums.txt || true)
          if [ "$total" -ne "$parseable" ]; then
            echo "::error::checksums.txt has lines RemoteFlow's updater cannot parse."
            cat checksums.txt
            exit 1
          fi
          for rid in win-x64 win-arm64; do
            if ! grep -qE "^[0-9a-f]{64}  RemoteFlow-$VERSION-$rid-setup\.exe$" checksums.txt; then
              echo "::error::checksums.txt has no parseable line for RemoteFlow-$VERSION-$rid-setup.exe."
              exit 1
            fi
          done

      - name: Generate the release notes
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: >
          ./scripts/generate-release-notes.ps1
          -Tag $env:TAG
          -Repository $env:REPOSITORY
          -OutputPath release-notes.md

      # Idempotent by construction: create when there is no release for the tag, update in place when
      # there is. Re-running a failed run therefore repairs the draft rather than adding a second one.
      #
      # An already-published release is never touched. At that point a human has decided the artefacts
      # are the release, and people may have downloaded them; replacing files under a published tag would
      # invalidate checksums someone has already recorded.
      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" > /dev/null 2>&1; then
            if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != "true" ]; then
              echo "::error::$TAG is already published. Refusing to overwrite a release people may have downloaded."
              exit 1
            fi

            echo "Updating the existing draft for $TAG."
            gh release edit "$TAG" \
              --draft=true \
              --prerelease="$PRERELEASE" \
              --title "RemoteFlow $VERSION" \
              --notes-file release-notes.md
            gh release upload "$TAG" dist/* --clobber
          else
            echo "Creating a draft release for $TAG."
            gh release create "$TAG" dist/* \
              --draft \
              --verify-tag \
              --prerelease="$PRERELEASE" \
              --title "RemoteFlow $VERSION" \
              --notes-file release-notes.md
          fi

      - name: Summarise
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          url="$(gh release view "$TAG" --json url --jq .url)"
          {
            echo "### Draft release ready"
            echo ""
            echo "[$TAG]($url) is a **draft**. Review it and publish by hand; nothing here publishes."
            echo ""
            echo '```'
            cat dist/checksums.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
