# Turn a tag into a reviewable draft release. Nothing here publishes anything: the last step of a release
# is a human reading the draft and pressing the button.
#
# RemoteFlow has no telemetry and no cloud dependency, and nothing here phones home. It does have an
# opt-in update check and, behind a second press and a confirmation, an in-app install of what that check
# found -- which is why the smoke test now covers an upgrade and why the checksums.txt shape is asserted
# rather than assumed. Both are contracts the application parses; see docs/adr/0018-self-update.md.
#
# Four build legs -- win-x64, win-arm64, linux-x64, linux-arm64 -- and every one builds on a runner of its
# own architecture rather than cross-publishing from one machine. That costs runners and buys the thing
# this workflow exists for: every artefact is launched and asked for its version before it can reach a
# release page. A cross-published ARM64 binary cannot be run on an x64 runner, and "we could not test it"
# is not a state a release should be in.
#
# The eight assets are two shapes, not one. Windows uses RemoteFlow-<version>-<rid>; the Debian packages
# use Debian's own remoteflow_<version>_<arch>.deb, because apt and dpkg expect it. Both shapes are built
# from the tag in more than one place here, so they are spelled out rather than globbed for.
#
# Every action is pinned by commit SHA. The trailing comment records the tag the SHA came from; when
# bumping, resolve the new tag to its SHA rather than trusting the tag to stay put.
name: Release

on:
  push:
    tags:
      - 'v*'

# The build jobs only read. Only the job that touches the release page gets contents: write, and nothing
# in this workflow needs any other scope.
permissions:
  contents: read

# Never two runs for one tag at once: the create-or-update step decides what to do by looking at whether
# the release already exists, and two runs racing on that check is how a tag ends up with two releases.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: build (${{ matrix.rid }})
    strategy:
      # A release with one architecture missing is not a release, so a failing leg should stop the other
      # rather than leave a half-built set to be reasoned about.
      fail-fast: true
      matrix:
        include:
          - rid: win-x64
            runner: windows-latest
          - rid: win-arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # MinVer reads tags and commit height. Without full history the build stamps a prerelease
          # version that disagrees with the tag, and the version check below would be the only thing
          # standing between that and a mislabelled release.
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # The tag reaches the script through the environment rather than through ${{ }} interpolation: a tag
      # name is attacker-controllable text, and interpolating it into a shell body would run it.
      - name: Read the version from the tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = $env:TAG.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+') {
            throw "The tag $($env:TAG) does not look like a version. Tags are written v0.1.0 or v0.1.0-rc.1."
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      # -RequireInstaller turns the missing-Inno-Setup warning into an error. The runner images carry
      # Inno Setup 6, and a release that quietly shipped zips and no installers because a tool moved is
      # exactly the silent partial success worth failing on.
      - name: Build the artefacts
        run: ./scripts/publish-windows.ps1 -Runtime ${{ matrix.rid }} -RequireInstaller

      # The gate. Extracts the zip and installs the installer, then runs --version on each and checks it
      # reports the version in the tag. A binary that does not start, or a build whose version does not
      # match its tag, fails the workflow here and never reaches a release page.
      #
      # -IncludeUpgrade additionally runs the installer over itself, which is what an in-app update does:
      # it proves a silent run with no /DIR reuses the recorded install location and that the relaunch
      # only fires for /UPDATE. Both are things RemoteFlow's updater depends on and nothing else tests.
      - name: Smoke-test the artefacts
        run: >
          ./scripts/smoke-test-artifacts.ps1
          -ExpectedVersion ${{ steps.version.outputs.version }}
          -Runtime ${{ matrix.rid }}
          -IncludeInstaller
          -IncludeUpgrade

      # Only on failure: the Inno Setup logs are the only record of what the installer actually did, and an
      # upgrade that fails on a runner cannot be diagnosed by reading the script.
      - name: Upload the installer logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installer-logs-${{ matrix.rid }}
          path: artifacts/*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload the artefacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.rid }}
          path: |
            artifacts/RemoteFlow-${{ steps.version.outputs.version }}-${{ matrix.rid }}.zip
            artifacts/RemoteFlow-${{ steps.version.outputs.version }}-${{ matrix.rid }}-setup.exe
          if-no-files-found: error
          retention-days: 7

  # Linux is deliberately thinner than the Windows job: nothing signs these artefacts and there is no
  # Linux equivalent of smoke-test-artifacts.ps1. What it does keep is the property the split runners
  # exist for. publish-linux.sh reads the version back out of the binary it just built by running it, and
  # can only do that on a runner of the same architecture — cross-published, it falls back to asking
  # MSBuild and reports "skipped (cross-architecture)", which would leave the check below checking
  # nothing.
  build-linux:
    name: build (${{ matrix.rid }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-latest
            arch: amd64
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # MinVer reads tags and commit height; see the Windows job.
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # Through the environment rather than ${{ }} interpolation, for the reason the Windows job gives: a
      # tag name is attacker-controllable text, and interpolating it into a shell body would run it.
      - name: Read the version from the tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          if [[ ! $version =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::The tag $TAG does not look like a version. Tags are written v0.1.0 or v0.1.0-rc.1."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Debian orders '~' before everything, including the empty string, so a prerelease has to be
          # written 0.3.0~rc.1 or dpkg would rank it above the 0.3.0 it precedes. publish-linux.sh names
          # the package that way, so every name built from the tag here has to agree with it.
          echo "deb-version=${version/-/\~}" >> "$GITHUB_OUTPUT"

      - name: Build the artefacts
        run: ./scripts/publish-linux.sh --runtime ${{ matrix.rid }}

      # The gate. Both artefacts are named after the version the script read out of the binary, never
      # after the tag, so a build whose version disagrees with its tag writes differently-named files and
      # is caught here rather than reaching a release page mislabelled. The package's control record is
      # checked as well, because that is the version dpkg will believe once it is installed.
      - name: Check the artefacts carry the version in the tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DEB_VERSION: ${{ steps.version.outputs.deb-version }}
          RID: ${{ matrix.rid }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          tarball="artifacts/RemoteFlow-$VERSION-$RID.tar.gz"
          package="artifacts/remoteflow_${DEB_VERSION}_${ARCH}.deb"
          missing=0
          for file in "$tarball" "$package"; do
            if [ ! -f "$file" ]; then
              echo "::error::$file is missing. publish-linux.sh names its output after the version it read back out of the binary, so a missing file here means the build does not report the version in the tag."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            ls -l artifacts
            exit 1
          fi
          declared="$(dpkg-deb --field "$package" Version)"
          if [ "$declared" != "$DEB_VERSION" ]; then
            echo "::error::$package declares Version $declared, but the tag says $DEB_VERSION."
            exit 1
          fi
          ls -l artifacts

      - name: Upload the artefacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.rid }}
          path: |
            artifacts/RemoteFlow-${{ steps.version.outputs.version }}-${{ matrix.rid }}.tar.gz
            artifacts/remoteflow_${{ steps.version.outputs.deb-version }}_${{ matrix.arch }}.deb
          if-no-files-found: error
          retention-days: 7

  release:
    name: draft release
    needs: [build, build-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The only write in the workflow, and the narrowest scope that can create a release.
    permissions:
      contents: write

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The notes are generated from the log between the previous tag and this one.
          fetch-depth: 0

      - name: Read the version from the tag
        id: version
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = $env:TAG.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+') {
            throw "The tag $($env:TAG) does not look like a version."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          # A version with a prerelease part is a release candidate, and GitHub should say so.
          $prerelease = if ($version -match '-') { 'true' } else { 'false' }
          "prerelease=$prerelease" >> $env:GITHUB_OUTPUT

      - name: Download the artefacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: release-*
          merge-multiple: true

      # Eight assets, in the two naming shapes described at the top of this file. Named rather than
      # counted-and-globbed, so a leg that uploaded the wrong architecture is a failure here and not a
      # release with two copies of x64 in it. The count is then checked as well: a stray file would
      # otherwise reach checksums.txt through the globs below and be published as part of the release.
      - name: Check the full set arrived
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          version="$VERSION"
          # Debian's '~' for a prerelease; see the Linux legs.
          deb_version="${version/-/\~}"
          expected=()
          for rid in win-x64 win-arm64; do
            expected+=("RemoteFlow-$version-$rid.zip" "RemoteFlow-$version-$rid-setup.exe")
          done
          for rid in linux-x64 linux-arm64; do
            expected+=("RemoteFlow-$version-$rid.tar.gz")
          done
          for arch in amd64 arm64; do
            expected+=("remoteflow_${deb_version}_${arch}.deb")
          done
          missing=0
          for file in "${expected[@]}"; do
            if [ ! -f "dist/$file" ]; then
              echo "::error::dist/$file is missing."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]
          found=$(find dist -maxdepth 1 -type f | wc -l)
          if [ "$found" -ne "${#expected[@]}" ]; then
            echo "::error::Expected ${#expected[@]} assets in dist, found $found. A release publishes what is here, so an unexpected file is not something to shrug at."
            ls -l dist
            exit 1
          fi
          ls -l dist

      # sha256sum's own format, so a user can verify the whole set with `sha256sum --check` rather than
      # comparing hashes by eye. Sorted by filename to keep the file stable across re-runs.
      - name: Write checksums.txt
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.zip *.exe *.deb *.tar.gz | sort -k 2 > checksums.txt
          cat checksums.txt

      # Recomputing what was just computed sounds circular, but it is checking the file GitHub will serve
      # rather than the variable that produced it: a truncated write or a stray file shows up here.
      #
      # The shape check is not circular at all. RemoteFlow's updater parses this file to find the digest of
      # the installer it just downloaded, and refuses to run anything it cannot find a digest for — so the
      # format is an interface now, not just something a human reads, and a release that broke it would
      # silently disable self-update for everyone already running.
      - name: Verify checksums.txt
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check --strict checksums.txt
          total=$(grep -c . checksums.txt)
          parseable=$(grep -cE '^[0-9a-f]{64}  [^/\\]+$' checksums.txt || true)
          if [ "$total" -ne "$parseable" ]; then
            echo "::error::checksums.txt has lines RemoteFlow's updater cannot parse."
            cat checksums.txt
            exit 1
          fi
          for rid in win-x64 win-arm64; do
            if ! grep -qE "^[0-9a-f]{64}  RemoteFlow-$VERSION-$rid-setup\.exe$" checksums.txt; then
              echo "::error::checksums.txt has no parseable line for RemoteFlow-$VERSION-$rid-setup.exe."
              exit 1
            fi
          done

      - name: Generate the release notes
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: >
          ./scripts/generate-release-notes.ps1
          -Tag $env:TAG
          -Repository $env:REPOSITORY
          -OutputPath release-notes.md

      # Idempotent by construction: create when there is no release for the tag, update in place when
      # there is. Re-running a failed run therefore repairs the draft rather than adding a second one.
      #
      # An already-published release is never touched. At that point a human has decided the artefacts
      # are the release, and people may have downloaded them; replacing files under a published tag would
      # invalidate checksums someone has already recorded.
      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" > /dev/null 2>&1; then
            if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != "true" ]; then
              echo "::error::$TAG is already published. Refusing to overwrite a release people may have downloaded."
              exit 1
            fi

            echo "Updating the existing draft for $TAG."
            gh release edit "$TAG" \
              --draft=true \
              --prerelease="$PRERELEASE" \
              --title "RemoteFlow $VERSION" \
              --notes-file release-notes.md
            gh release upload "$TAG" dist/* --clobber
          else
            echo "Creating a draft release for $TAG."
            gh release create "$TAG" dist/* \
              --draft \
              --verify-tag \
              --prerelease="$PRERELEASE" \
              --title "RemoteFlow $VERSION" \
              --notes-file release-notes.md
          fi

      - name: Summarise
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          url="$(gh release view "$TAG" --json url --jq .url)"
          {
            echo "### Draft release ready"
            echo ""
            echo "[$TAG]($url) is a **draft**. Review it and publish by hand; nothing here publishes."
            echo ""
            echo '```'
            cat dist/checksums.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
