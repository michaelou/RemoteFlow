# Build and test on the three desktop platforms. This transcribes the checks contributors have run
# locally since Milestone 1 (see CONTRIBUTING.md); it does not add new gates.
#
# Wall-time budget: 15 minutes for the slowest leg, and the job times out at 20. A leg that regularly
# approaches the budget is a signal to split it, not to raise the timeout.
#
# Every action is pinned by commit SHA. The trailing comment records the tag the SHA came from; when
# bumping, resolve the new tag to its SHA rather than trusting the tag to stay put.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI only reads the repository. Anything that needs to write gets its own workflow with its own scope.
permissions:
  contents: read

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  # Keep the package cache inside the workspace so actions/cache handles it identically on all three
  # runner images.
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  build:
    name: build (${{ matrix.leg }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      # One platform failing should not hide the state of the other two.
      fail-fast: false
      matrix:
        include:
          - leg: windows
            os: windows-latest
            integration: false
          - leg: linux
            os: ubuntu-latest
            # Docker is available on the Linux runner, so this is the only leg that can host the SSH
            # container the integration tests need.
            integration: true
          - leg: macos
            os: macos-latest
            integration: false

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # Restore is the only network-bound step; the build itself is fast enough (tens of seconds) that
      # caching compiler output would cost more in cache churn than it saves.
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('global.json', 'Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore

      # Directory.Build.props sets TreatWarningsAsErrors for every project, so a new warning fails here.
      - name: Build
        run: dotnet build --no-restore -c Release

      # The default run excludes Category=Integration on every project, so this is the same command
      # contributors run locally, plus trx and coverage reports.
      - name: Unit tests
        run: >
          dotnet test --no-build -c Release
          -p:ExtraTestingPlatformCommandLineArguments="--report-trx --coverage --coverage-output-format cobertura"

      - name: Integration tests (SSH, Docker)
        if: matrix.integration
        run: >
          dotnet test tests/RemoteFlow.Ssh.IntegrationTests --no-build -c Release --filter Category=Integration
          -p:ExtraTestingPlatformCommandLineArguments="--report-trx --coverage --coverage-output-format cobertura"

      # Without this note a green Windows or macOS leg reads as "integration tests passed here".
      - name: Note skipped integration tests
        if: ${{ !matrix.integration }}
        shell: bash
        run: |
          echo "### Integration tests were NOT run on ${{ matrix.leg }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The SSH integration suite needs a Docker engine and runs on the Linux leg only." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ matrix.leg }}
          # Each test project writes into its own bin/**/TestResults, so the artefact paths name the
          # project that produced them.
          path: |
            tests/**/TestResults/**
          if-no-files-found: warn
          retention-days: 14
